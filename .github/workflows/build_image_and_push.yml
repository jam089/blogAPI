name: build_image_and_push.yml
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Confirm test success"
        required: true
        default: "yes"

jobs:
  blog_api_build_and_push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./app/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/blogapp-backend:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/blogapp-backend:${{ github.sha }}
  blog_frontend_build_and_push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/blogapp-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/blogapp-frontend:${{ github.sha }}