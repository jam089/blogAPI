services:

  app:
    build:
      context: ./
      dockerfile: ./docker-build/Dockerfile
    env_file:
      - ./.env
    ports:
      - 8000:8000
    networks:
      - backend
    volumes:
      - ./data:/app/import_data:ro
    depends_on:
      pg:
        condition: service_healthy
      elasticsearch:
        condition: service_started
      redis:
        condition: service_started
    develop:
      watch:
        - action: sync+restart
          path: ./app
          target: /app
        - action: rebuild
          path: ./poetry.lock

  pg:
    image: postgres
    environment:
      POSTGRES_DB: ${BLOGAPI__DB__SCHEMA}
      POSTGRES_USER: ${BLOGAPI__DB__LOGIN}
      POSTGRES_PASSWORD: ${BLOGAPI__DB__PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BLOGAPI__DB__LOGIN} -d ${BLOGAPI__DB__SCHEMA}"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      backend:
      pg_net:

  redis:
    image: redis/redis-stack-server
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/var/lib/redis/data
    command: >
      sh -c 'redis-server --requirepass "${BLOGAPI__CACHE__PASS}" --appendonly yes'
    networks:
      - backend

  elasticsearch:
    image: elasticsearch:8.15.2
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - http.port=9200
      - http.cors.allow-origin=http://0.0.0.0:1358
      - http.cors.enabled=true
      - http.cors.allow-methods=OPTIONS,HEAD,GET,POST,PUT,DELETE
      - http.cors.allow-headers=X-Requested-With,X-Auth-Token,Content-Type,Content-Length,Authorization
      - http.cors.allow-credentials=true
      - network.publish_host=localhost
    ports:
      - "9200:9200"
    volumes:
      - esdata:/var/lib/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          memory: 2g
    networks:
      backend:

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    networks:
      pg_net:

  dejavu:
    image: appbaseio/dejavu:latest
    ports:
      - "1358:1358"

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379:0:radmin
    ports:
      - "8081:8081"
    networks:
      - redis_net

volumes:
  pgdata:
    driver: local
  redis_data:
    driver: local
  esdata:
    driver: local

networks:
  backend:
  redis_net:
  pg_net: