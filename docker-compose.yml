services:

  pg:
    image: postgres
    environment:
      POSTGRES_DB: blog_app
      POSTGRES_USER: pgadmin
      POSTGRES_PASSWORD: pgadmin
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis/redis-stack-server
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/var/lib/redis/data
    command: ["redis-server",
              "--requirepass", "radmin",
              "--appendonly", "yes"]

  elasticsearch:
    image: elasticsearch:8.15.2
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - ELASTIC_PASSWORD=guest
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - esdata:/var/lib/elasticsearch/data
    networks:
      - esnet
    ulimits:
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        limits:
          memory: 2g

  adminer:
    image: adminer
    ports:
      - "8080:8080"

volumes:
  pgdata:
    driver: local
  redis_data:
    driver: local
  esdata:
    driver: local

networks:
  esnet: